name: Managed service kernel boundary
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      zero_cost_verified:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.5'
      - name: Run focused media admission and configuration regressions
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Dtest=ManagedMediaBoundaryTest,MediaContainerBudgetTest,PdfLinuxServiceBudgetTest,MediaRuntimeConfigurationTest,SupervisedPdfPageRuntimeTest,SupervisedVideoClipRuntimeTest
          test -q
      - name: Compile the exact proposed boundary against pinned runtime classes
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          image=ghcr.io/arijit634/notes-knowledge-workspace-private-preview@sha256:e40b0a9551773440989e669b0fcff900df5d98788f00beab8624c3f724435b62
          docker pull "$image"
          container=$(docker create "$image")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/opt/pdf/artifacts/classes" "$RUNNER_TEMP/production-classes"
          docker cp "$container:/opt/pdf/artifacts/libraries" "$RUNNER_TEMP/production-libraries"
          mkdir -p "$RUNNER_TEMP/boundary/classes"
          gcc -std=c11 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/boundary/production-boundary" .github/deploy/managed-preview/service-boundary.c
          gcc -std=c11 -O2 -Wall -Wextra -Werror -DSERVICE_BOUNDARY_DIAGNOSTIC -o "$RUNNER_TEMP/boundary/service-boundary-diagnostic" .github/deploy/managed-preview/service-boundary.c
          javac -cp "$RUNNER_TEMP/production-classes:$RUNNER_TEMP/production-libraries/*" -d "$RUNNER_TEMP/boundary/classes" \
            src/main/java/org/notesknowledge/notes/{ManagedMediaBoundary,MediaContainerBudget,PdfLinuxDeploymentCustody}.java \
            src/test/java/org/notesknowledge/notes/ManagedBoundaryQualification.java
          docker build --build-arg "SOURCE_SHA=$GITHUB_SHA" -f .github/deploy/host-preflight/boundary.Dockerfile -t nkw-service-boundary "$RUNNER_TEMP/boundary"
      - name: Verify guarded writable host and strict negative controls
        run: |
          set -euo pipefail
          common=(run --rm --network none --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus .15 --pids-limit 34583 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=96m)
          for mode in writable readonly; do
            flags=()
            test "$mode" != readonly || flags+=(--read-only)
            docker "${common[@]}" "${flags[@]}" nkw-service-boundary --once > "$RUNNER_TEMP/boundary-$mode.jsonl"
          done
          # A configuration flag and even a manually set process limit cannot
          # substitute for the kernel write boundary installed by the entry point.
          set +e
          docker "${common[@]}" --ulimit nproc=300:300 --entrypoint /jdk/bin/java nkw-service-boundary \
            -Xmx64m -XX:ActiveProcessorCount=1 -Dnkw.media.service-boundary=landlock-managed-v1 \
            -cp '/qualification:/opt/pdf/artifacts/classes:/opt/pdf/artifacts/libraries/*' \
            org.notesknowledge.notes.ManagedBoundaryQualification --once > "$RUNNER_TEMP/boundary-unguarded.txt" 2>&1
          unguarded=$?
          docker "${common[@]}" nkw-service-boundary arbitrary-command > "$RUNNER_TEMP/boundary-command.txt" 2>&1
          arbitrary=$?
          set -e
          test "$unguarded" != 0 && test "$arbitrary" = 125
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for mode in ('writable','readonly'):
              rows=[json.loads(row) for row in (root/('boundary-'+mode+'.jsonl')).read_text().splitlines() if row.startswith('{')]
              assert len(rows)==2 and rows[0]==dict(serviceBoundary=True,trustedWriteDenied=True,privateTemporaryWriteAllowed=True,processLimitRaiseDenied=True,namespaceEscapeDenied=True)
              assert rows[1]==dict(managedNativePreflight=True,parentWriteBoundaryVerified=True,hardProcessBudgetVerified=True,runtimeCustodyVerified=True,unchangedPdfWorkerSucceeded=True,liveProviderCalls=0)
          (root/'service-boundary-verification.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],guardedWritablePassed=True,guardedReadOnlyPassed=True,unguardedDenied=True,arbitraryCommandDenied=True,liveProviderCalls=0))+'\n')
          PY
      - name: Publish the same disposable diagnostic
        if: inputs.publish && inputs.zero_cost_verified
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-service-boundary-probe"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker tag nkw-service-boundary "$repository:sha-$GITHUB_SHA"
          docker push "$repository:sha-$GITHUB_SHA"
          subject=$(docker image inspect --format '{{index .RepoDigests 0}}' "$repository:sha-$GITHUB_SHA")
          printf 'name=%s\ndigest=%s\n' "$repository" "${subject#*@}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$subject" > "$RUNNER_TEMP/service-boundary-subject.txt"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: steps.publish.outcome == 'success'
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: service-boundary-${{ github.sha }}
          path: |
            ${{ runner.temp }}/boundary-*.jsonl
            ${{ runner.temp }}/service-boundary-*.json
            ${{ runner.temp }}/service-boundary-subject.txt
          if-no-files-found: warn
          retention-days: 7
