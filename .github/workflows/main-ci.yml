name: MAIN CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sanity:
    name: MAIN / Build sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tracked public tree allowlist
        shell: bash
        run: |
          unexpected="$({
            git ls-files -z |
              while IFS= read -r -d '' path; do
                printf '%s\n' "${path%%/*}"
              done |
              sort -u |
              while IFS= read -r entry; do
                case "$entry" in
                  .editorconfig|.gitattributes|.github|.gitignore|.gitleaks.toml|.mvn|.node-version|frontend|mvnw|mvnw.cmd|pom.xml|src|README.md|LICENSE) ;;
                  *) printf '%s\n' "$entry" ;;
                esac
              done
          } || exit 1)"
          test -z "$unexpected"
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify Maven Wrapper contract and package backend
        shell: bash
        run: |
          grep -Fxq 'distributionType=only-script' .mvn/wrapper/maven-wrapper.properties
          grep -Fxq 'distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip' .mvn/wrapper/maven-wrapper.properties
          ./mvnw --version
          ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify npm and lockfile consistency
        working-directory: frontend
        shell: bash
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          npm ci --ignore-scripts
          git diff --exit-code -- package.json package-lock.json
          git diff --exit-code

  fast:
    name: MAIN / FAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Run FAST suite
        run: ./mvnw --batch-mode --no-transfer-progress -Dgroups=FAST test

  frontend:
    name: MAIN / FRONTEND
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install and verify frontend
        working-directory: frontend
        shell: bash
        run: |
          test "$(npm --version)" = "11.19.0"
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm exec playwright install --with-deps chromium
          npm run test:e2e

  modulith-architecture:
    name: MAIN / Modulith architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify seven-module architecture
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=ModularityTest test

  secret-scan:
    name: MAIN / Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history with pinned Gitleaks
        shell: bash
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config=/repo/.gitleaks.toml --log-opts=HEAD --redact --no-banner --exit-code=1 /repo
