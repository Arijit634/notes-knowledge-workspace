name: Managed preview qualification
on:
  pull_request:
    paths:
      - '.github/deploy/managed-preview/**'
      - '.github/workflows/managed-preview.yml'
      - 'src/main/java/org/notesknowledge/PrivatePreviewConfiguration.java'
      - 'src/main/java/org/notesknowledge/PreviewMigrationCommand.java'
      - 'src/main/resources/application*preview.properties'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: managed-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  managed-runtime:
    name: Preview / managed runtime and security boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.5'
      - name: Verify native target and input
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          bash -n .github/deploy/managed-preview/start.sh
          python3 -m py_compile .github/deploy/managed-preview/smoke.py
          python3 -m unittest discover -s .github/deploy/managed-preview -p 'test_*.py'
      - name: Build the immutable rootless runtime
        run: docker build --build-arg "SOURCE_SHA=$SOURCE_SHA" --iidfile "$RUNNER_TEMP/managed-preview-image" -f .github/deploy/managed-preview/Dockerfile .
      - name: Scan the actual candidate image
        run: |
          image="$(cat "$RUNNER_TEMP/managed-preview-image")"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$image"
      - name: Verify single-container budget, TLS, perimeter, sessions and recovery without providers
        run: python3 .github/deploy/managed-preview/smoke.py "$(cat "$RUNNER_TEMP/managed-preview-image")"
