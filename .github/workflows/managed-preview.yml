name: Managed preview qualification
on:
  pull_request:
    paths:
      - '.github/deploy/managed-preview/**'
      - '.github/workflows/managed-preview.yml'
      - 'src/main/java/org/notesknowledge/PrivatePreviewConfiguration.java'
      - 'src/main/java/org/notesknowledge/PreviewMigrationCommand.java'
      - 'src/main/java/org/notesknowledge/identity/**'
      - 'src/main/resources/application*preview.properties'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: managed-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  managed-runtime:
    name: Preview / managed runtime and security boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.5'
      - name: Verify native target and input
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          bash -n .github/deploy/managed-preview/start.sh
          python3 -m py_compile .github/deploy/managed-preview/smoke.py
          python3 -m unittest discover -s .github/deploy/managed-preview -p 'test_*.py'
      - name: Build the immutable rootless runtime
        run: docker build --build-arg "SOURCE_SHA=$SOURCE_SHA" --iidfile "$RUNNER_TEMP/managed-preview-image" -f .github/deploy/managed-preview/Dockerfile .
      - name: Scan the actual candidate image
        run: |
          image="$(cat "$RUNNER_TEMP/managed-preview-image")"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$image"
      - name: Verify scanner-owned SBOM completion
        run: |
          set -euo pipefail
          image="$(cat "$RUNNER_TEMP/managed-preview-image")"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$RUNNER_TEMP:/evidence" \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --format cyclonedx --output /evidence/preview-raw.cdx.json "$image"
          docker run --rm --network none --entrypoint redis-server "$image" --version | grep -F 'v=8.10.2'
          python3 .github/deploy/managed-preview/complete_sbom.py
      - name: Verify single-container budget, TLS, perimeter, sessions and recovery without providers
        run: python3 .github/deploy/managed-preview/smoke.py "$(cat "$RUNNER_TEMP/managed-preview-image")"
  full-password-budget:
    name: Preview / full application password and memory budget
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Install checksum-pinned native JDK
        run: bash .github/scripts/media-jdk.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Build the complete production application
        run: |
          set -euo pipefail
          (cd frontend && npm ci && npm run build)
          ./mvnw --batch-mode --no-transfer-progress -Pwith-frontend -Dtest=BoundedPasswordEncoderTest,Argon2CompatibilityTest,MediaRuntimeConfigurationTest package -q
      - name: Qualify full-cost password authentication within the unchanged service budget
        run: |
          set -euo pipefail
          bash .github/scripts/qualify-full-hosted.sh
          python3 .github/scripts/reconcile-image-security.py \
            "$RUNNER_TEMP/full-hosted-candidate/security/security-readiness.json" \
            "$RUNNER_TEMP/full-hosted-candidate/security/native-artifact-facts.json" \
            "$RUNNER_TEMP/full-hosted-candidate/combined-runtime.json" \
            .github/security/full-hosted-runtime-dispositions.json \
            "$RUNNER_TEMP/full-hosted-candidate/security/security-applicability.json"
      - name: Retain exact candidate evidence without publishing an image
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-password-budget-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/full-hosted-candidate/
          if-no-files-found: warn
          retention-days: 3
