name: Private preview qualification
on:
  pull_request:
    paths:
      - '.github/deploy/private-preview/**'
      - '.github/workflows/private-preview.yml'
      - 'src/**'
      - 'frontend/**'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      qualify_service_boundary:
        description: Qualify the complete inherited managed-host boundary without credentials
        type: boolean
        default: false
      qualify_host_preflight:
        description: Observe exact production native safety gates without application data
        type: boolean
        default: false
      zero_cost_probe_verified:
        description: Operator verified no-charge public runner and public GHCR entitlement
        type: boolean
        default: false
      qualify_small_host:
        description: Measure a 448 MiB app with 64 MiB host headroom and 0.1 CPU on native x86_64
        type: boolean
        default: false
      qualify_small_bundle:
        description: Measure app, proxy and Redis in one 448 MiB / 0.1 CPU aggregate budget
        type: boolean
        default: false
      qualify_full_hosted:
        description: Build and exercise the explicit full native bundle; no publication or live providers
        type: boolean
        default: false
      expected_source:
        description: Exact 40-character SHA required for full hosted qualification
        type: string
        default: ''
      qualify_native_startup:
        description: Measure native backend startup at 512 MiB / 0.1 CPU; not full feature or release clearance
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: private-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  service-boundary:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_service_boundary && inputs.zero_cost_probe_verified
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/service-boundary.yml
    with:
      publish: true
      zero_cost_verified: true
  host-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_host_preflight && inputs.zero_cost_probe_verified
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/host-preflight.yml
    with:
      publish: true
      zero_cost_verified: true
  small-host:
    name: Preview / constrained x86_64 feasibility
    if: github.event_name == 'workflow_dispatch' && (inputs.qualify_small_host || inputs.qualify_small_bundle)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify native platform and immutable input
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Build the unchanged preview runtime
        run: docker build --build-arg "SOURCE_SHA=$SOURCE_SHA" --iidfile "$RUNNER_TEMP/preview-image" -f .github/deploy/private-preview/Dockerfile .
      - name: Measure bounded startup and session persistence without providers
        env:
          BUNDLE: ${{ inputs.qualify_small_bundle }}
        run: |
          mode=--small-host
          if [ "$BUNDLE" = true ]; then mode=--small-bundle; fi
          python3 .github/deploy/private-preview/smoke.py "$(cat "$RUNNER_TEMP/preview-image")" "$mode"
  native-preview:
    name: Preview / native ARM and deployment controls
    if: github.event_name != 'workflow_dispatch' || (!inputs.qualify_small_host && !inputs.qualify_small_bundle && !inputs.qualify_native_startup && !inputs.qualify_full_hosted && !inputs.qualify_host_preflight && !inputs.qualify_service_boundary)
    # Standard ARM runner is free for this public repository; never a larger runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify native platform and pinned infrastructure tool
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location -O https://releases.hashicorp.com/terraform/1.17.1/terraform_1.17.1_linux_arm64.zip
          curl --fail --silent --show-error --location -O https://releases.hashicorp.com/terraform/1.17.1/terraform_1.17.1_SHA256SUMS
          grep ' terraform_1.17.1_linux_arm64.zip$' terraform_1.17.1_SHA256SUMS | sha256sum --check -
          unzip -q terraform_1.17.1_linux_arm64.zip terraform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate infrastructure without credentials or real resources
        working-directory: .github/deploy/private-preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Registry signature downloads returned repeated GitHub HTTP 504s.
          # Fetch the SAME official archive through the release API and enforce
          # the publisher checksum already authenticated in the committed lock.
          mirror="$RUNNER_TEMP/provider-mirror"
          package="$mirror/registry.terraform.io/oracle/oci"
          mkdir -p "$package"
          gh release download v9.12.1 --repo oracle/terraform-provider-oci --pattern terraform-provider-oci_9.12.1_linux_arm64.zip --dir "$package"
          grep -F '"zh:bd69d4c38214fb0230770adef394ad50b09f13c06602abce6dbd37171fc4ff51"' .terraform.lock.hcl
          printf '%s  %s\n' bd69d4c38214fb0230770adef394ad50b09f13c06602abce6dbd37171fc4ff51 "$package/terraform-provider-oci_9.12.1_linux_arm64.zip" | sha256sum --check -
          terraform init -backend=false -input=false -lockfile=readonly -plugin-dir="$mirror"
          terraform fmt -check -recursive
          terraform validate
          terraform test -no-color
      - name: Verify deployment-secret preparation boundaries
        run: python3 -m unittest discover -s .github/deploy/private-preview -p 'test_*.py'
      - name: Verify edge error privacy with the actual pinned server
        run: python3 .github/deploy/private-preview/test_edge.py
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.5'
      - name: Verify preview boundaries and runtime role on PostgreSQL 18
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          '-DargLine=-Xmx768m -XX:ActiveProcessorCount=2'
          -Dtest=PrivatePreviewConfigurationTest,PrivatePreviewFilterTest,PreviewMigrationDatabaseTest,DevelopmentSessionCookieTest,ApplicationStaticControllerTest,PrivateStorageConfigurationTest,PrivateAvatarStorageConfigurationTest,PublicAvatarStorageConfigurationTest,PublicMediaStorageConfigurationTest,ModularityTest
          test -q
      - name: Build immutable same-origin application image
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg "SOURCE_SHA=$SOURCE_SHA" --iidfile "$RUNNER_TEMP/preview-image" -f .github/deploy/private-preview/Dockerfile .
      - name: Scan the actual candidate image
        shell: bash
        run: |
          set -euo pipefail
          image="$(cat "$RUNNER_TEMP/preview-image")"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$image"
      - name: Verify native boot, migration, restart and fail-closed HTTP boundaries
        shell: bash
        run: python3 .github/deploy/private-preview/smoke.py "$(cat "$RUNNER_TEMP/preview-image")"
  native-budget:
    name: Preview / native startup resource measurement
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_native_startup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Validate exclusive measurement and native platform
        env:
          SMALL_HOST: ${{ inputs.qualify_small_host }}
          SMALL_BUNDLE: ${{ inputs.qualify_small_bundle }}
        run: |
          test "$SMALL_HOST" = false && test "$SMALL_BUNDLE" = false
          test "$(uname -m)" = x86_64
          python3 .github/scripts/test-operations.py
          python3 .github/scripts/test-health-probe.py
      - name: Install checksum-pinned native JDK
        run: bash .github/scripts/media-jdk.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Build accepted frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Package production JAR and compile isolated controllers
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Pwith-frontend
          -Dtest=MediaRuntimePropertiesTest,MediaRuntimeConfigurationTest,PostgresRecoveryCommandTest,OciPrivateAttachmentObjectStoreTest,CompactAttachmentParserTest
          package -q
      - name: Measure actual native startup at the Free host ceilings
        run: bash .github/scripts/probe-native-budget.sh
      - name: Preserve safe positive or negative measurement and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: native-budget-startup
          path: |
            ${{ runner.temp }}/native-budget-startup/*.json
            ${{ runner.temp }}/native-budget-startup/*.jsonl
          if-no-files-found: warn
          retention-days: 3

  full-hosted:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_full_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Require the exact requested source revision
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_source }}
          persist-credentials: false
      - name: Verify offline deployment contracts
        run: |
          python3 .github/scripts/test-gitleaks-contract.py
          python3 .github/scripts/test-operations.py
          python3 .github/scripts/test-health-probe.py
          python3 -m unittest discover -s .github/deploy/managed-preview -p 'test_*.py'
          bash -n .github/deploy/managed-preview/start-full.sh
          bash -n .github/deploy/managed-preview/build-openh264.sh
          bash -n .github/scripts/qualify-full-hosted.sh
      - name: Install checksum-pinned native JDK
        run: bash .github/scripts/media-jdk.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Build the accepted frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Package production classes and isolated native controllers
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Pwith-frontend
          -Dtest=MediaRuntimePropertiesTest,MediaRuntimeConfigurationTest,PostgresRecoveryCommandTest
          package -q
      - name: Build and exercise the complete native bundle
        run: bash .github/scripts/qualify-full-hosted.sh
      - name: Preserve bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: full-hosted-candidate
          path: |
            ${{ runner.temp }}/full-hosted-candidate/*.json
            ${{ runner.temp }}/full-hosted-candidate/*.jsonl
            ${{ runner.temp }}/full-hosted-candidate/security/security-readiness.json
            ${{ runner.temp }}/full-hosted-candidate/security/deployment.cdx.json
            ${{ runner.temp }}/full-hosted-candidate/security/shipped-artifacts.sha256
            ${{ runner.temp }}/full-hosted-candidate/security/full-runtime.cdx.json
            ${{ runner.temp }}/full-hosted-candidate/security/full-bundle-artifacts.sha256
            ${{ runner.temp }}/full-hosted-candidate/security/native-artifact-facts.json
          if-no-files-found: warn
          retention-days: 3
