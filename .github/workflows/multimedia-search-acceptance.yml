name: Packaged multimedia search acceptance
on:
  push:
    branches: [knowledge/multimedia-search-completion]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install approved checksum-pinned JDK
        run: bash .github/scripts/media-jdk.sh
      - name: Package actual backend and controlled external transports
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Dtest=KnowledgeQueryContractsTest,GoogleDerivationAdaptersTest package -q
          ./mvnw --batch-mode --no-transfer-progress dependency:build-classpath -DincludeScope=test -Dmdep.outputFile=target/qualification-classpath.txt -q
      - name: Demonstrate scheduled ingestion and HTTP search using the production JAR
        run: bash .github/scripts/multimedia-search-acceptance.sh
      - name: Retain synthetic search responses and citation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multimedia-search-${{ matrix.runner }}
          path: ${{ runner.temp }}/multimedia-search-report/accepted/search-demonstration.json
          if-no-files-found: warn
          retention-days: 3
