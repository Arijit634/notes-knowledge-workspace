daemon off;
worker_processes 1;
pid /tmp/nkw-edge/nginx.pid;
# Request-related errors can contain OAuth callback URLs. The sanitized access
# log below provides status and timing; the supervisor reports process failure.
error_log /dev/null;
events {
    worker_connections 256;
}
http {
    log_format preview '{"status":$status,"duration":$request_time}';
    access_log /dev/stdout preview;
    server_tokens off;
    client_max_body_size 27m;
    client_header_timeout 10s;
    client_body_timeout 2m;
    send_timeout 2m;
    keepalive_timeout 1m;
    client_body_temp_path /tmp/nkw-edge/body;
    proxy_temp_path /tmp/nkw-edge/proxy;
    fastcgi_temp_path /tmp/nkw-edge/fastcgi;
    uwsgi_temp_path /tmp/nkw-edge/uwsgi;
    scgi_temp_path /tmp/nkw-edge/scgi;
    server {
        listen 10000 default_server;
        server_name _;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # A CDN transformation can weaken the core ETag used by If-Match.
        # Keep private/public responses uncacheable and their bytes unchanged.
        # Replace the origin field so intermediaries receive one cache policy.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-transform" always;
        gzip off;
        location = /_preview/ready {
            if ($request_method != GET) { return 405; }
            proxy_pass http://127.0.0.1:8081/actuator/health/readiness;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location ~* ^/(actuator|management|debug|v3/api-docs|swagger) {
            return 404;
        }
        location / {
            if ($host != __PREVIEW_HOST__) { return 400; }
            auth_basic "Private preview";
            auth_basic_user_file /tmp/nkw-edge/htpasswd;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Connection "";
            # Keep the core representation stable even when the hosting edge
            # requests compression on behalf of an identity-only API client.
            proxy_set_header Accept-Encoding identity;
            proxy_set_header Authorization "";
            proxy_set_header Forwarded "";
            # A transport peer is conservative; unverified platform headers
            # never become an original-user IP or authorization claim.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host __PREVIEW_HOST__;
            proxy_set_header Host __PREVIEW_HOST__;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2m;
            proxy_send_timeout 2m;
        }
    }
}
