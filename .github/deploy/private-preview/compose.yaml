name: nkw-preview
services:
  edge:
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PREVIEW_HOST: ${PREVIEW_HOST:?owned hostname required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 10.89.10.2
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    mem_limit: 128m
    pids_limit: 128
    logging: &logging
      driver: local
      options: {max-size: "10m", max-file: "2"}
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    restart: unless-stopped
    environment:
      POSTGRES_DB: nkw_preview
      POSTGRES_USER: nkw_preview_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/db-owner
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pg_data:/var/lib/postgresql
      - ./secrets/db-owner:/run/secrets/db-owner:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nkw_preview_migrator -d nkw_preview"]
      interval: 10s
      timeout: 3s
      retries: 12
    shm_size: 128m
    mem_limit: 768m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging: *logging
  redis:
    image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    restart: unless-stopped
    # Password stays in a protected config file, never argv or Compose output.
    command: [redis-server, /run/secrets/redis.conf]
    volumes:
      - redis_data:/data
      - ./secrets/redis.conf:/run/secrets/redis.conf:ro
    networks: [data]
    mem_limit: 128m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    logging: *logging
  app:
    image: ${APP_IMAGE:?exact qualified image required}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: operations,private-preview
      APP_ENVIRONMENT: private-preview
      APP_VERSION: ${SOURCE_SHA:?exact source SHA required}
    volumes:
      - ./secrets/app:/run/secrets:ro
    networks:
      edge:
        ipv4_address: 10.89.10.3
      data: {}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: [CMD, java, -Dloader.main=org.notesknowledge.PreviewHealthCommand, -cp, /app/application.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
      start_period: 120s
      interval: 20s
      timeout: 6s
      retries: 6
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=512m,noexec,nosuid,nodev,uid=65533,gid=65533,mode=700"]
    mem_limit: 1408m
    pids_limit: 256
    stop_grace_period: 300s
    logging: *logging
  migrate:
    profiles: [operator]
    image: ${APP_IMAGE:?exact qualified image required}
    entrypoint: [java, -Xmx256m, -Dloader.main=org.notesknowledge.PreviewMigrationCommand, -cp, /app/application.jar, org.springframework.boot.loader.launch.PropertiesLauncher, /run/secrets/migration.properties]
    volumes:
      - ./secrets/migration.properties:/run/secrets/migration.properties:ro
    networks: [data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev,uid=65533,gid=65533,mode=700"]
    mem_limit: 384m
    pids_limit: 64
    logging: *logging
networks:
  edge:
    ipam:
      config: [{subnet: 10.89.10.0/24}]
  data:
    internal: true
    ipam:
      config: [{subnet: 10.89.11.0/24}]
volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
