# Optional hosted-only coordination; other profiles retain normal scheduling.
operations.database-idle.enabled=true
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
# IdentityIdleMaintenance replaces only this cron with deadline-aware cleanup.
spring.session.jdbc.cleanup-cron=-
# Startup schema admission is cached, unlike the live DB readiness contributor.
management.endpoint.health.group.liveness.include=livenessState,coreSchema
