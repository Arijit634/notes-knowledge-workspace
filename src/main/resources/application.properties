spring.application.name=notes-knowledge-workspace
spring.modulith.detection-strategy=explicitly-annotated
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=identity.spring_session
spring.session.jdbc.flush-mode=immediate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
spring.jackson.deserialization.fail-on-unknown-properties=true

logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=${APP_ENVIRONMENT:local}
logging.structured.ecs.service.version=${APP_VERSION:0.0.1-SNAPSHOT}

management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,coreSchema
management.health.redis.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.error.include-message=never
server.error.include-stacktrace=never

# Hibernate's constraint diagnostics can echo candidate email bind values.
logging.level.org.hibernate.orm.jdbc.error=OFF

# Security-email transport remains disabled until separately configured and qualified.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Conservative local worker defaults, all bounded and overridable per deployment.
# Combined SMTP connection/read/write timeouts must not exceed provider-timeout.
identity.delivery.batch-size=10
identity.delivery.worker-concurrency=2
identity.delivery.queue-capacity=4
identity.delivery.lease-duration=2m
identity.delivery.provider-timeout=30s
identity.delivery.max-attempts=5
identity.delivery.min-backoff=30s
identity.delivery.max-backoff=1h
identity.delivery.retry-jitter=15s
identity.delivery.poll-delay=5s
identity.delivery.worker-alias=identity_worker

# Provisional conservative 3A controls; calibrate from observed safe traffic before release.
# Aggregate applies before all four auth operations. The provider bucket is
# consumed only for eligible dispatch. At most two first-use 24-hour
# windows can overlap any rolling 24 hours; 150 per window stays within
# the planned 300-message daily Free ceiling. Live entitlement requires revalidation.
identity.rate.window-seconds=60
identity.rate.registration-ceiling=6
identity.rate.verification-request-ceiling=6
identity.rate.verification-confirmation-ceiling=12
identity.rate.password-login-ceiling=10
identity.rate.aggregate-ceiling=60
identity.rate.provider-window-seconds=86400
identity.rate.provider-ceiling=150

# Initial bounded MFA policy. Key material is deployment-supplied, never source-controlled.
identity.mfa.challenge-lifetime=5m
identity.mfa.enrollment-lifetime=10m
identity.mfa.recent-auth-lifetime=5m
identity.mfa.timestep-seconds=30
identity.mfa.digits=6
identity.mfa.allowed-skew-steps=1
identity.mfa.recovery-code-count=8
# Per persisted pre-MFA challenge; distributed source/subject/global limits remain separate.
identity.mfa.max-challenge-failures=5
identity.rate.mfa-ceiling=8
identity.rate.mfa-management-ceiling=6
identity.rate.recent-auth-ceiling=8

# Google OIDC remains unavailable without deployment-supplied confidential-client settings.
identity.oidc.google.enabled=${GOOGLE_OIDC_ENABLED:false}
identity.oidc.google.client-id=${GOOGLE_OIDC_CLIENT_ID:}
identity.oidc.google.client-secret=${GOOGLE_OIDC_CLIENT_SECRET:}
identity.oidc.google.issuer=https://accounts.google.com
identity.oidc.google.login-redirect-uri=${GOOGLE_OIDC_LOGIN_REDIRECT_URI:}
identity.oidc.google.recent-redirect-uri=${GOOGLE_OIDC_RECENT_REDIRECT_URI:}
identity.oidc.google.transaction-lifetime=5m
