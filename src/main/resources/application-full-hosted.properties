# Explicit operator selection only, after exact-image and hosted qualification.
# Requires operations, private-preview and managed-preview; it is never a default.
# Credentials, models/lineage, native identities and the current disclosure remain external.
identity.delivery.smtp-enabled=true
identity.delivery.polling-enabled=true
knowledge.derivation.enabled=true
knowledge.derivation.scheduling-enabled=true
knowledge.public.scheduling-enabled=true
knowledge.operations.scheduling-enabled=true
notes.media-runtime.pdf.enabled=true
notes.media-runtime.video.enabled=true
knowledge.derivation.provider=gemini
knowledge.derivation.tier=unpaid
knowledge.derivation.region=global
knowledge.derivation.dispatch-policy=unpaid-nonsensitive-consent
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
