# Owner-authorized restricted Linux x86_64 staging; not the public-production profile.
spring.config.import=${NKW_PREVIEW_SECRET_IMPORT:configtree:/run/secrets/}
server.address=0.0.0.0
server.port=8080
server.ssl.enabled=false
server.servlet.context-path=
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=10\\.89\\.10\\.2
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.host-header=X-Forwarded-Host
server.tomcat.accesslog.enabled=false
management.server.address=127.0.0.1
management.server.port=8081
management.health.redis.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,coreSchema,redis
spring.datasource.url=jdbc:postgresql://postgres:5432/nkw_preview
spring.datasource.username=nkw_preview_runtime
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=false
notes.cursor.active.version=preview1
knowledge.operations.handle.key-version=preview1
knowledge.operations.envelope.key-version=preview1
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
nkw.preview.access=ip-restricted
identity.oidc.google.enabled=true
identity.oidc.google.issuer=https://accounts.google.com
identity.oidc.google.login-redirect-uri=${nkw.preview.origin}/api/auth/oidc/google/callback
identity.oidc.google.link-redirect-uri=${nkw.preview.origin}/api/auth/oidc/google/link-callback
identity.delivery.public-origin=${nkw.preview.origin}
identity.delivery.smtp-enabled=false
identity.delivery.polling-enabled=false
knowledge.derivation.enabled=false
knowledge.derivation.scheduling-enabled=false
knowledge.public.scheduling-enabled=false
knowledge.operations.scheduling-enabled=false
notes.media-runtime.pdf.enabled=false
notes.media-runtime.video.enabled=false
notes.private-storage.enabled=true
notes.private-storage.profile=oci-s3-private-v1
notes.private-storage.endpoint=https://${nkw.preview.namespace}.compat.objectstorage.${nkw.preview.region}.oraclecloud.com
notes.private-storage.region=${nkw.preview.region}
notes.private-storage.bucket=${nkw.preview.bucket}
notes.private-storage.credentials-source=injected
notes.private-storage.private-bucket-confirmed=true
notes.private-storage.access-key-id=${nkw.preview.s3.access-key-id}
notes.private-storage.secret-access-key=${nkw.preview.s3.secret-access-key}
profile.avatar-storage.enabled=true
profile.avatar-storage.profile=oci-s3-private-v1
profile.avatar-storage.endpoint=${notes.private-storage.endpoint}
profile.avatar-storage.region=${nkw.preview.region}
profile.avatar-storage.bucket=${nkw.preview.bucket}
profile.avatar-storage.credentials-source=injected
profile.avatar-storage.private-bucket-confirmed=true
profile.avatar-storage.access-key-id=${nkw.preview.s3.access-key-id}
profile.avatar-storage.secret-access-key=${nkw.preview.s3.secret-access-key}
profile.public-avatar-storage.enabled=true
profile.public-avatar-storage.profile=oci-s3-private-v1
profile.public-avatar-storage.endpoint=${notes.private-storage.endpoint}
profile.public-avatar-storage.region=${nkw.preview.region}
profile.public-avatar-storage.bucket=${nkw.preview.bucket}
profile.public-avatar-storage.credentials-source=injected
profile.public-avatar-storage.private-bucket-confirmed=true
profile.public-avatar-storage.access-key-id=${nkw.preview.s3.access-key-id}
profile.public-avatar-storage.secret-access-key=${nkw.preview.s3.secret-access-key}
publishing.media-storage.enabled=true
publishing.media-storage.profile=oci-s3-private-v1
publishing.media-storage.endpoint=${notes.private-storage.endpoint}
publishing.media-storage.region=${nkw.preview.region}
publishing.media-storage.bucket=${nkw.preview.bucket}
publishing.media-storage.credentials-source=injected
publishing.media-storage.private-bucket-confirmed=true
publishing.media-storage.access-key-id=${nkw.preview.s3.access-key-id}
publishing.media-storage.secret-access-key=${nkw.preview.s3.secret-access-key}
