# Approved isolated managed-host variant. Requires private-preview and operations.
spring.config.import=file:/etc/secrets/runtime.properties
nkw.preview.access=password-gated
server.address=127.0.0.1
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1
spring.datasource.url=jdbc:postgresql://${nkw.preview.database-host}:5432/nkw_preview?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory&connectTimeout=10&socketTimeout=30
spring.data.redis.host=127.0.0.1
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
