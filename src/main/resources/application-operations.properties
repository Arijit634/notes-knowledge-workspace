# One replica, behind the same-origin HTTPS edge. Not a production deployment authorization.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=90s
management.server.port=8081
management.server.address=127.0.0.1
management.server.ssl.enabled=false
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
operations.telemetry.enabled=true
spring.flyway.enabled=false
# Single-replica summaries; no per-resource dimensions or speculative global histograms.
management.metrics.distribution.percentiles.notes.workspace.search.request=0.5,0.95,0.99
management.metrics.distribution.percentiles.notes.workspace.ai.provider=0.5,0.95,0.99
management.metrics.distribution.percentiles.notes.workspace.retrieval.pre_generation=0.5,0.95,0.99
# Bounded network waits are shorter than the 300-second container stop budget.
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
